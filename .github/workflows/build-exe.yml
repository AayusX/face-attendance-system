name: build-exe

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install "setuptools<81"
          python -m pip install -r requirements-windows.txt pyinstaller

      - name: Build portable bundle
        shell: cmd
        run: |
          set GUI_CONSOLE=0
          python -m PyInstaller app.spec --noconfirm

      - name: Verify bundle
        shell: cmd
        run: |
          dist\FaceAttendance\FaceAttendance.exe --selftest
          type selftest_result.txt
          findstr /C:"OK " selftest_result.txt >nul && (echo selftest PASSED) || (exit /b 1)
          del selftest_result.txt

      - name: Package portable zip
        shell: pwsh
        run: Compress-Archive -Force -Path dist\FaceAttendance -DestinationPath FaceAttendance-portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: FaceAttendance-portable
          path: |
            FaceAttendance-portable.zip
            dist/FaceAttendance/